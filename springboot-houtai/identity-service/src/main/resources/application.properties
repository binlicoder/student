spring.application.name=identity-service
server.port=${SERVER_PORT:8081}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:student}
spring.datasource.password=${DB_PASSWORD}
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.binlicoder.houtai.entity
mybatis.configuration.map-underscore-to-camel-case=true